[custom]
; ===========================================================
; 基础通用设置
; ===========================================================
api_mode=false
exclude_remarks=(?i)到期|重置|剩余|流量|官网|产品|订阅
include_remarks=
rename_node=!!GROUP!!

; ===========================================================
; 策略组定义
; ===========================================================

; 基础节点池
custom_proxy_group=🚀 代理节点`select`.*
custom_proxy_group=🏠 家宽节点`select`.*

; 功能分组
custom_proxy_group=🎵 TikTok`select`[]🏠 家宽节点`[]🚀 代理节点`[]DIRECT`.*
custom_proxy_group=🤖 AI 服务`select`[]🏠 家宽节点`[]🚀 代理节点`[]DIRECT`.*
custom_proxy_group=🎙️ 会议直播`select`[]🚀 代理节点`[]🏠 家宽节点`[]DIRECT`.*
custom_proxy_group=🔍 Google`select`[]🚀 代理节点`[]🏠 家宽节点`[]DIRECT`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 代理节点`[]🏠 家宽节点`.*
custom_proxy_group=🇺🇳 国外网站`select`[]🚀 代理节点`[]🏠 家宽节点`[]DIRECT`.*
custom_proxy_group=🇨🇳 国内网站`select`[]DIRECT`[]🚀 代理节点`[]🏠 家宽节点`.*

; 兜底
custom_proxy_group=🐟 规则之外`select`[]DIRECT`[]🚀 代理节点`[]🏠 家宽节点`.*

; ===========================================================
; 规则集关联
; ===========================================================

ruleset=DIRECT,https://raw.githubusercontent.com/teekalpha/MiRules/main/rules/Private.list
ruleset=🏠 家宽节点,https://raw.githubusercontent.com/teekalpha/MiRules/main/rules/HomeProxy.list
ruleset=🎵 TikTok,https://raw.githubusercontent.com/teekalpha/MiRules/main/rules/TikTok.list
; TikTok.list 域名规则之外的补充，覆盖官方 geosite/geoip 库收录的域名与 IP 段
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=🎵 TikTok,[]GEOIP,tiktok,no-resolve
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/teekalpha/MiRules/main/rules/AI.list
ruleset=🎙️ 会议直播,https://raw.githubusercontent.com/teekalpha/MiRules/main/rules/Meeting.list
ruleset=🔍 Google,https://raw.githubusercontent.com/teekalpha/MiRules/main/rules/Google.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/teekalpha/MiRules/main/rules/Microsoft.list
ruleset=🇺🇳 国外网站,https://raw.githubusercontent.com/teekalpha/MiRules/main/rules/Media.list
ruleset=🇺🇳 国外网站,https://raw.githubusercontent.com/teekalpha/MiRules/main/rules/Proxy.list
; Telegram 纯 IP 兜底（MTProto 等不经域名解析的连接），域名规则见 Proxy.list「通讯」分类
ruleset=🇺🇳 国外网站,[]GEOIP,telegram,no-resolve
ruleset=🇨🇳 国内网站,https://raw.githubusercontent.com/teekalpha/MiRules/main/rules/Direct.list
; 未匹配到以上任何分组、且判定为中国大陆 IP 的流量归入「国内网站」分组
ruleset=🇨🇳 国内网站,[]GEOIP,CN
; 兜底：以上规则均未命中的流量归入「规则之外」分组，供手动选择出口
ruleset=🐟 规则之外,[]FINAL
